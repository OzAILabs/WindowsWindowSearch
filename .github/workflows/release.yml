name: Release

# Pushing a tag like v1.0.14 publishes the MSI as a GitHub release.
# A tag with a suffix, like v1.0.14-rc.1, publishes it as a prerelease.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Check the tag matches the version
        shell: pwsh
        run: |
          $version = ([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.Version
          $tagVersion = $env:GITHUB_REF_NAME -replace '^v' -replace '-.*$'
          if ($tagVersion -ne $version) { throw "Tag $env:GITHUB_REF_NAME doesn't match Version $version in Directory.Build.props" }
      - name: Test
        run: dotnet test tests/WindowSearcher.Tests -c Release
      - name: Build the installer
        run: dotnet build installer -c Release
      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $msi = Get-ChildItem installer/bin -Recurse -Filter *.msi | Select-Object -First 1
          $hash = (Get-FileHash $msi.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($msi.Name)" | Set-Content "$($msi.FullName).sha256"
          $flags = @('--generate-notes', '--verify-tag')
          if ($env:GITHUB_REF_NAME -match '-') { $flags += '--prerelease' }
          gh release create $env:GITHUB_REF_NAME $msi.FullName "$($msi.FullName).sha256" @flags
